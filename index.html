<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SO23 Viva Experiences</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-main: #0f172a;       
    --bg-card: #1e293b;       
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --accent: #3b82f6;        
    --border: #334155;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-main);
    color: var(--text-primary);
    line-height: 1.6;
    overflow-x: hidden;
  }

  header {
    position: sticky;
    top: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    z-index: 100;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .stats-container {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }

  .counter-text {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
  }

  .visitor-counter {
    font-size: 10px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .visitor-counter::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 5px var(--accent);
  }

  .search-container {
    position: relative;
    width: 60%;
    max-width: 400px;
  }

  .search-container input {
    width: 100%;
    padding: 10px 12px 10px 36px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #1e293b;
    color: var(--text-primary);
    font-size: 15px;
    outline: none;
  }

  .search-container input:focus { border-color: var(--accent); }

  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    opacity: 0.5;
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
  }

  .viva-section {
    padding: 40px 0;
    border-bottom: 1px solid var(--border);
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .id-badge {
    display: inline-block;
    background: rgba(59, 130, 246, 0.1);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 16px;
  }

  .content-text {
    font-size: 18px;
    color: var(--text-primary);
    user-select: text;
    -webkit-user-select: text;
    white-space: pre-wrap;
  }

  #noResults {
    display: none;
    text-align: center;
    padding: 100px 20px;
    color: var(--text-secondary);
  }

  @media(max-width: 600px) {
    .content-text { font-size: 16px; }
    header { padding: 10px; }
    .viva-section { padding: 30px 0; }
  }
</style>
</head>

<body>

<header>
  <div class="search-container">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Search viva keyword...">
  </div>
  <div class="stats-container">
    <div class="counter-text" id="stats">0 Results</div>
    <div class="visitor-counter" id="visitorCount">VIEWS: ...</div>
  </div>
</header>

<main class="container" id="mainContent">
  <div id="noResults">No experiences match your search.</div>
</main>

<script type="module">
import { vivaData } from './v.data.js';

const mainContent = document.getElementById("mainContent");
const stats = document.getElementById("stats");
const noResults = document.getElementById("noResults");
const visitorDisplay = document.getElementById("visitorCount");

let dataSlides = [];

/* --- ROBUST VISITOR TRACKING (NO SETUP) --- */
function trackVisitor() {
  // Use a reliable keyword-based hit image
  const keyword = "plabon-viva-experience-2026";
  const img = new Image();
  // Using a tracking pixel that actually works
  img.src = `https://hits.seeyoufarm.com/api/count/incr/badge.svg?url=https%3A%2F%2Fgithub.com%2Fplabon-viva%2F${keyword}&count_bg=%233B82F6&title_bg=%231E293B&icon=&icon_color=%23E7E7E7&title=views&edge_flat=false`;
  
  // Since we are using an image badge, we extract a dummy number or just show "Active"
  // If you want a REAL number, use this logic to fetch the specific JSON:
  fetch(`https://api.countapi.xyz/hit/plabonviva/${keyword}`)
    .then(res => res.json())
    .then(data => {
      visitorDisplay.innerText = `VIEWS: ${data.value}`;
    })
    .catch(() => {
      // Fallback if API fails
      visitorDisplay.innerText = `SESSION: LIVE`;
    });
}

/* Data Parsing Logic */
vivaData.forEach(item => {
  let raw = item.questions;
  let entries = raw.split("},").map(e => e + "}");
  entries.forEach(entry => {
    let id = entry.match(/"id":\s*(\d+)/);
    let text = entry.match(/"text":\s*"([^"]+)/);
    let length = entry.match(/"length":\s*(\d+)/);

    if (id && text && length && parseInt(length[1]) > 350) {
      dataSlides.push({ id: id[1], text: text[1] });
    }
  });
});

/* State-Based Rendering */
function renderSections() {
  const fragment = document.createDocumentFragment();
  dataSlides.forEach((d) => {
    let section = document.createElement("article");
    section.className = "viva-section";
    section.setAttribute("data-text", d.text.toLowerCase());
    section.innerHTML = `
      <div class="id-badge">VIVA ID • ${d.id}</div>
      <div class="content-text">${d.text}</div>
    `;
    fragment.appendChild(section);
  });
  mainContent.appendChild(fragment);
  updateStats(dataSlides.length);
}

/* Logic: Results Counter */
function updateStats(count) {
  stats.innerText = `${count} Results`;
}

document.getElementById("search").addEventListener("input", function() {
  const query = this.value.toLowerCase().trim();
  const allSections = document.querySelectorAll(".viva-section");
  let visibleCount = 0;

  allSections.forEach(section => {
    const text = section.getAttribute("data-text");
    if (text.includes(query)) {
      section.style.display = "block";
      visibleCount++;
    } else {
      section.style.display = "none";
    }
  });

  noResults.style.display = visibleCount > 0 ? "none" : "block";
  updateStats(visibleCount);
  window.scrollTo({ top: 0, behavior: "auto" });
});

// Run
trackVisitor();
renderSections();
</script>

</body>
</html>
