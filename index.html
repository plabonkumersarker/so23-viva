<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SO23 Viva Experiences</title>

<style>
:root {
    --bg: #f4f6fb;
    --text: #1a1a1a;
    --card: #ffffff;
    --accent: #3b82f6;
}

body.dark {
    --bg: #0f172a;
    --text: #e5e7eb;
    --card: #1e293b;
    --accent: #60a5fa;
}

body {
    margin: 0;
    font-family: "Inter", sans-serif;
    background: var(--bg);
    color: var(--text);
}

/* HEADER */
header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--card);
    padding: 12px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-bottom: 1px solid rgba(0,0,0,0.05);
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

h1 {
    font-size: 18px;
    margin: 0;
}

.toggle {
    cursor: pointer;
    font-size: 20px;
}

/* SEARCH */
.search-box input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: none;
    outline: none;
    background: var(--bg);
    font-size: 14.5px;
}

/* CONTENT */
.container {
    max-width: 850px;
    margin: 25px auto;
    padding: 0 16px;
}

.card {
    background: var(--card);
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.id {
    color: var(--accent);
    font-size: 12px;
    margin-bottom: 8px;
    font-weight: bold;
}

.text {
    font-size: 16.5px;
    line-height: 1.7;
}

/* RIGHT PROGRESS */
#progressBar {
    position: fixed;
    top: 0;
    right: 0;
    width: 4px;
    height: 0%;
    background: var(--accent);
    z-index: 200;
}

/* PDF STYLE SCROLL */
#pdfScroll {
    position: fixed;
    right: 8px;
    top: 90px;
    width: 8px;
    height: calc(100vh - 110px);
    background: rgba(0,0,0,0.08);
    border-radius: 10px;
    z-index: 300;
}

body.dark #pdfScroll {
    background: rgba(255,255,255,0.1);
}

#thumb {
    width: 100%;
    height: 60px;
    background: var(--accent);
    border-radius: 10px;
    cursor: grab;
}

#thumb:hover {
    background: #2563eb;
}

/* MOBILE */
@media(max-width:600px){
    #pdfScroll {
        display: none;
    }
}
</style>
</head>

<body>

<div id="progressBar"></div>

<!-- PDF STYLE SCROLL -->
<div id="pdfScroll">
    <div id="thumb"></div>
</div>

<header>
    <div class="top-bar">
        <h1>📚 SO23 Viva Experiences</h1>
        <div class="toggle" onclick="toggleTheme()" id="icon">🌙</div>
    </div>

    <div class="search-box">
        <input type="text" id="search" placeholder="🔍 Search viva questions...">
    </div>
</header>

<div class="container" id="content"></div>

<script type="module">
import { vivaData } from './v.data.js';

const container = document.getElementById("content");
let allCards = [];

vivaData.forEach(item => {
    let raw = item.questions;
    let entries = raw.split("},").map(e => e + "}");

    entries.forEach(entry => {
        try {
            let idMatch = entry.match(/"id":\s*(\d+)/);
            let textMatch = entry.match(/"text":\s*"([^"]+)/);
            let lengthMatch = entry.match(/"length":\s*(\d+)/);

            if (!idMatch || !textMatch || !lengthMatch) return;

            let id = idMatch[1];
            let text = textMatch[1];
            let length = parseInt(lengthMatch[1]);

            if (length > 350) {
                let div = document.createElement("div");
                div.className = "card";
                div.dataset.text = text.toLowerCase();

                div.innerHTML = `
                    <div class="id">ID • ${id}</div>
                    <div class="text">${text}</div>
                `;

                container.appendChild(div);
                allCards.push(div);
            }

        } catch(e){}
    });
});

/* SEARCH */
document.getElementById("search").addEventListener("input", function(){
    let value = this.value.toLowerCase();

    allCards.forEach(card => {
        card.style.display = card.dataset.text.includes(value) ? "block" : "none";
    });
});
</script>

<script>
function toggleTheme() {
    document.body.classList.toggle("dark");
    document.getElementById("icon").textContent =
        document.body.classList.contains("dark") ? "☀️" : "🌙";
}

/* PROGRESS BAR */
window.addEventListener("scroll", () => {
    let scroll = document.documentElement.scrollTop;
    let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    let percent = (scroll / height) * 100;

    document.getElementById("progressBar").style.height = percent + "%";
    updateThumb();
});

/* PDF SCROLL */
const thumb = document.getElementById("thumb");
const track = document.getElementById("pdfScroll");

let isDragging = false;

function updateThumb() {
    let scrollTop = document.documentElement.scrollTop;
    let docHeight = document.documentElement.scrollHeight - window.innerHeight;
    let trackHeight = track.clientHeight;
    let thumbHeight = thumb.clientHeight;

    let top = (scrollTop / docHeight) * (trackHeight - thumbHeight);
    thumb.style.transform = `translateY(${top}px)`;
}

/* CLICK TRACK */
track.addEventListener("click", (e) => {
    let rect = track.getBoundingClientRect();
    let clickY = e.clientY - rect.top;

    let percent = clickY / rect.height;
    let docHeight = document.documentElement.scrollHeight - window.innerHeight;

    document.documentElement.scrollTop = percent * docHeight;
});

/* DRAG */
thumb.addEventListener("mousedown", () => {
    isDragging = true;
    thumb.style.cursor = "grabbing";
});

document.addEventListener("mouseup", () => {
    isDragging = false;
    thumb.style.cursor = "grab";
});

document.addEventListener("mousemove", (e) => {
    if (!isDragging) return;

    let rect = track.getBoundingClientRect();
    let offsetY = e.clientY - rect.top;

    let percent = offsetY / rect.height;
    percent = Math.max(0, Math.min(1, percent));

    let docHeight = document.documentElement.scrollHeight - window.innerHeight;
    document.documentElement.scrollTop = percent * docHeight;
});

/* INIT */
updateThumb();
</script>

</body>
</html>
