<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SO23 Viva Experiences</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-main: #0f172a;       
    --bg-card: #1e293b;       
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --accent: #3b82f6;        
    --border: #334155;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-main);
    color: var(--text-primary);
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* Sticky Header */
  header {
    position: sticky;
    top: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    z-index: 100;
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .counter {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    white-space: nowrap;
  }

  .search-container {
    position: relative;
    width: 60%;
    max-width: 300px;
  }

  .search-container input {
    width: 100%;
    padding: 8px 12px 8px 32px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-main);
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
  }

  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    opacity: 0.6;
  }

  /* Continuous Scroll Layout */
  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
  }

  .viva-section {
    min-height: 80dvh; /* Ensures focus on one at a time while scrolling */
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px 0;
    border-bottom: 1px solid var(--border);
  }

  .viva-section:last-child { border-bottom: none; }

  .id-badge {
    display: inline-block;
    background: rgba(59, 130, 246, 0.1);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 16px;
    align-self: flex-start;
  }

  .content-text {
    font-size: 19px;
    color: var(--text-primary);
    user-select: text;
    -webkit-user-select: text;
    white-space: pre-wrap; /* Keeps formatting from data */
  }

  /* Floating Progress Bar */
  .progress-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    height: 3px;
    background: var(--accent);
    width: 0%;
    z-index: 101;
    transition: width 0.1s ease;
  }

  @media(max-width: 600px) {
    .content-text { font-size: 17px; }
    header { padding: 10px 15px; }
    .viva-section { min-height: 90dvh; padding: 30px 0; }
  }
</style>
</head>

<body>

<div class="progress-bar" id="progress"></div>

<header>
  <div class="search-container">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Search...">
  </div>
  <div class="counter" id="scrollStats">Reading 1 of 0</div>
</header>

<main class="container" id="mainContent"></main>

<script type="module">
import { vivaData } from './v.data.js';

const mainContent = document.getElementById("mainContent");
const scrollStats = document.getElementById("scrollStats");
const progressBar = document.getElementById("progress");
let dataSlides = [];

/* Parse Data */
vivaData.forEach(item => {
  let raw = item.questions;
  let entries = raw.split("},").map(e => e + "}");
  entries.forEach(entry => {
    let id = entry.match(/"id":\s*(\d+)/);
    let text = entry.match(/"text":\s*"([^"]+)/);
    let length = entry.match(/"length":\s*(\d+)/);

    if (id && text && length && parseInt(length[1]) > 350) {
      dataSlides.push({ id: id[1], text: text[1] });
    }
  });
});

/* Render Sections */
dataSlides.forEach((d, index) => {
  let section = document.createElement("article");
  section.className = "viva-section";
  section.id = `viva-${index}`;
  section.innerHTML = `
    <div class="id-badge">VIVA ID • ${d.id}</div>
    <div class="content-text">${d.text}</div>
  `;
  mainContent.appendChild(section);
});

/* Update Progress & Counter on Scroll */
const sections = document.querySelectorAll(".viva-section");
window.addEventListener("scroll", () => {
  // Update Progress Bar
  const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
  const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
  const scrolled = (winScroll / height) * 100;
  progressBar.style.width = scrolled + "%";

  // Update Section Counter
  let current = 0;
  sections.forEach((section, i) => {
    const rect = section.getBoundingClientRect();
    if (rect.top < window.innerHeight / 2) {
      current = i + 1;
    }
  });
  if(current > 0) {
    scrollStats.innerText = `Experience ${current} of ${dataSlides.length}`;
  }
});

/* Search Functionality - Scroll to result */
document.getElementById("search").addEventListener("input", function() {
  const val = this.value.toLowerCase();
  if (!val) return;

  const foundIndex = dataSlides.findIndex(d => d.text.toLowerCase().includes(val));
  if (foundIndex !== -1) {
    const target = document.getElementById(`viva-${foundIndex}`);
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
});

// Initial count
scrollStats.innerText = `Total: ${dataSlides.length} Experiences`;
</script>

</body>
</html>
