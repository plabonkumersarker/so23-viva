<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viva Experiences</title>

<style>
    :root {
        --bg: #f5f7fa;
        --text: #222;
        --card: #ffffff;
        --accent: #4a90e2;
    }

    body.dark {
        --bg: #121212;
        --text: #e0e0e0;
        --card: #1e1e1e;
        --accent: #90caf9;
    }

    body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        transition: 0.3s;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        background: var(--card);
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        position: sticky;
        top: 0;
        z-index: 100;
    }

    h1 {
        font-size: 18px;
        margin: 0;
    }

    .toggle {
        cursor: pointer;
        font-size: 20px;
    }

    .container {
        max-width: 800px;
        margin: 20px auto;
        padding: 10px;
    }

    .card {
        background: var(--card);
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        line-height: 1.6;
    }

    .id {
        font-weight: bold;
        color: var(--accent);
        margin-bottom: 8px;
    }

    /* Scroll progress bar */
    #progressBar {
        position: fixed;
        top: 0;
        right: 0;
        width: 6px;
        height: 0%;
        background: var(--accent);
        z-index: 200;
    }
</style>
</head>

<body>

<div id="progressBar"></div>

<header>
    <h1>📚 Viva Experiences</h1>
    <div class="toggle" onclick="toggleTheme()" id="themeIcon">🌙</div>
</header>

<div class="container" id="content"></div>

<script type="module">
import { vivaData } from './v.data.js';

const container = document.getElementById("content");

// Filter and render
vivaData.forEach(item => {
    try {
        let parsed = typeof item.questions === "string"
            ? JSON.parse("[" + item.questions + "]")
            : item.questions;

        parsed.forEach(q => {
            if (q.length > 350) {
                const card = document.createElement("div");
                card.className = "card";

                card.innerHTML = `
                    <div class="id">ID: ${q.id}</div>
                    <div>${q.text}</div>
                `;

                container.appendChild(card);
            }
        });
    } catch (e) {
        console.warn("Parsing error:", e);
    }
});
</script>

<script>
// Theme toggle
function toggleTheme() {
    document.body.classList.toggle("dark");
    const icon = document.getElementById("themeIcon");
    icon.textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
}

// Scroll progress
window.onscroll = function () {
    let winScroll = document.documentElement.scrollTop;
    let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    let scrolled = (winScroll / height) * 100;
    document.getElementById("progressBar").style.height = scrolled + "%";
};
</script>

</body>
</html>
