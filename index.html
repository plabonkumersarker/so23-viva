<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SO23 Viva Filter</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-main: #0f172a;       
    --bg-card: #1e293b;       
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --accent: #3b82f6;        
    --border: #334155;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-main);
    color: var(--text-primary);
    line-height: 1.6;
    overflow-x: hidden;
  }

  header {
    position: sticky;
    top: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    z-index: 100;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .counter {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    white-space: nowrap;
  }

  .search-container {
    position: relative;
    width: 65%;
    max-width: 400px;
  }

  .search-container input {
    width: 100%;
    padding: 10px 12px 10px 36px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #1e293b;
    color: var(--text-primary);
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-container input:focus { border-color: var(--accent); }

  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    opacity: 0.5;
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
  }

  .viva-section {
    padding: 40px 0;
    border-bottom: 1px solid var(--border);
    /* Standard smooth reveal */
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .id-badge {
    display: inline-block;
    background: rgba(59, 130, 246, 0.1);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 16px;
  }

  .content-text {
    font-size: 18px;
    color: var(--text-primary);
    user-select: text;
    -webkit-user-select: text;
    white-space: pre-wrap;
  }

  #noResults {
    display: none;
    text-align: center;
    padding: 100px 20px;
    color: var(--text-secondary);
  }

  @media(max-width: 600px) {
    .content-text { font-size: 16px; }
    header { padding: 10px; }
    .viva-section { padding: 30px 0; }
  }
</style>
</head>

<body>

<header>
  <div class="search-container">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Filter by keyword...">
  </div>
  <div class="counter" id="stats">0 Experiences</div>
</header>

<main class="container" id="mainContent">
  <div id="noResults">No experiences match your search.</div>
</main>

<script type="module">
import { vivaData } from './v.data.js';

const mainContent = document.getElementById("mainContent");
const stats = document.getElementById("stats");
const noResults = document.getElementById("noResults");
let dataSlides = [];

/* 1. Parse Data */
vivaData.forEach(item => {
  let raw = item.questions;
  let entries = raw.split("},").map(e => e + "}");
  entries.forEach(entry => {
    let id = entry.match(/"id":\s*(\d+)/);
    let text = entry.match(/"text":\s*"([^"]+)/);
    let length = entry.match(/"length":\s*(\d+)/);

    if (id && text && length && parseInt(length[1]) > 350) {
      dataSlides.push({ id: id[1], text: text[1] });
    }
  });
});

/* 2. Render Initial State */
function renderSections() {
  dataSlides.forEach((d, index) => {
    let section = document.createElement("article");
    section.className = "viva-section";
    section.setAttribute("data-text", d.text.toLowerCase());
    section.innerHTML = `
      <div class="id-badge">VIVA ID • ${d.id}</div>
      <div class="content-text">${d.text}</div>
    `;
    mainContent.appendChild(section);
  });
  updateCount();
}

/* 3. Helper: Update Header Count */
function updateCount() {
  const visible = document.querySelectorAll(".viva-section[style='display: block;'], .viva-section:not([style])").length;
  stats.innerText = `${visible} Results`;
}

/* 4. Filter Logic */
document.getElementById("search").addEventListener("input", function() {
  const query = this.value.toLowerCase().trim();
  const allSections = document.querySelectorAll(".viva-section");
  let foundAny = false;

  allSections.forEach(section => {
    const text = section.getAttribute("data-text");
    if (text.includes(query)) {
      section.style.display = "block";
      foundAny = true;
    } else {
      section.style.display = "none";
    }
  });

  // Show/Hide "No Results" message
  noResults.style.display = foundAny ? "none" : "block";
  
  // Jump to top on search for better UX
  window.scrollTo({ top: 0, behavior: 'instant' });
  updateCount();
});

// Run on load
renderSections();
</script>

</body>
</html>
