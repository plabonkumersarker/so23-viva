<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SO23 Viva Slides</title>

<style>
body {
  margin:0;
  font-family:"Segoe UI", sans-serif;
  background: radial-gradient(circle at top, #0a0a1a, #000);
  color:#f1f5f9;
  overflow:hidden;
}

/* Slides */
.slides {
  display:flex;
  flex-direction:column;
  height:100vh;
  transition:transform .7s ease;
}

.slide {
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:30px;
  text-align:center;
}

.card {
  max-width:850px;
}

.id {
  color:#7dd3fc;
  font-size:18px;
  margin-bottom:15px;
}

.text {
  font-size:22px;
  line-height:1.7;
}

/* SEARCH */
.search {
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  width:90%;
  max-width:500px;
}

.search input {
  width:100%;
  padding:12px;
  border-radius:30px;
  border:none;
  outline:none;
  font-size:15px;
}

/* DRAG BAR */
.drag-bar {
  position: fixed;
  top: 50%;
  right: 15px;
  transform: translateY(-50%);
  width: 14px;
  height: 60%;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
}

.drag-knob {
  width: 30px;
  height: 30px;
  background: #7dd3fc;
  border-radius:50%;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

/* Mobile text adjust */
@media(max-width:600px){
  .text { font-size:18px; }
}
</style>
</head>

<body>

<div class="search">
  <input type="text" id="search" placeholder="🔍 Search viva...">
</div>

<div class="slides" id="slides"></div>

<div class="drag-bar" id="dragBar">
  <div class="drag-knob" id="dragKnob"></div>
</div>

<script type="module">
import { vivaData } from './v.data.js';

const slidesEl = document.getElementById("slides");
let dataSlides = [];

/* Parse Data */
vivaData.forEach(item=>{
  let raw = item.questions;
  let entries = raw.split("},").map(e=>e+"}");

  entries.forEach(entry=>{
    let id = entry.match(/"id":\s*(\d+)/);
    let text = entry.match(/"text":\s*"([^"]+)/);
    let length = entry.match(/"length":\s*(\d+)/);

    if(id && text && length && parseInt(length[1])>350){
      dataSlides.push({
        id:id[1],
        text:text[1]
      });
    }
  });
});

/* Render Slides */
dataSlides.forEach(d=>{
  let s = document.createElement("section");
  s.className="slide";

  s.innerHTML = `
    <div class="card">
      <div class="id">VIVA ID • ${d.id}</div>
      <div class="text">${d.text}</div>
    </div>
  `;

  slidesEl.appendChild(s);
});

</script>

<script>
let index=0;
let slides=document.querySelectorAll(".slide");
const slidesEl=document.getElementById("slides");
const knob=document.getElementById("dragKnob");
const bar=document.getElementById("dragBar");

/* Update Slide */
function update(){
  slidesEl.style.transform=`translateY(-${index*100}vh)`;
  let h=bar.clientHeight;
  knob.style.top=(index/slides.length*h)+"px";
}

/* Navigation */
function next(){ if(index<slides.length-1) index++; update(); }
function prev(){ if(index>0) index--; update(); }

/* Wheel */
window.addEventListener("wheel",e=>{
  e.deltaY>0?next():prev();
});

/* Touch */
let startY=null;
window.addEventListener("touchstart",e=>startY=e.touches[0].clientY);
window.addEventListener("touchend",e=>{
  let dy=e.changedTouches[0].clientY-startY;
  if(Math.abs(dy)>40) dy<0?next():prev();
});

/* Drag */
let dragging=false;

knob.addEventListener("mousedown",()=>dragging=true);
window.addEventListener("mouseup",()=>dragging=false);

knob.addEventListener("touchstart",()=>dragging=true);
window.addEventListener("touchend",()=>dragging=false);

window.addEventListener("mousemove",move);
window.addEventListener("touchmove",move);

function move(e){
  if(!dragging) return;

  let rect=bar.getBoundingClientRect();
  let y=e.touches?e.touches[0].clientY:e.clientY;

  let pos=y-rect.top;
  pos=Math.max(0,Math.min(rect.height,pos));

  index=Math.floor(pos/rect.height*slides.length);
  update();
}

/* SEARCH */
document.getElementById("search").addEventListener("input",function(){
  let val=this.value.toLowerCase();

  let found=dataSlides.findIndex(d=>d.text.toLowerCase().includes(val));

  if(found!==-1){
    index=found;
    update();
  }
});

update();
</script>

</body>
</html>
