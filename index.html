<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viva Experiences</title>

<style>
:root {
    --bg: #f5f7fa;
    --text: #222;
    --card: #fff;
    --accent: #4a90e2;
}

body.dark {
    --bg: #121212;
    --text: #e0e0e0;
    --card: #1e1e1e;
    --accent: #90caf9;
}

body {
    margin: 0;
    font-family: sans-serif;
    background: var(--bg);
    color: var(--text);
}

header {
    display: flex;
    justify-content: space-between;
    padding: 15px;
    background: var(--card);
    position: sticky;
    top: 0;
}

.toggle {
    cursor: pointer;
    font-size: 20px;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 10px;
}

.card {
    background: var(--card);
    padding: 15px;
    margin-bottom: 12px;
    border-radius: 10px;
}

.id {
    color: var(--accent);
    font-weight: bold;
    margin-bottom: 6px;
}

/* Scroll bar */
#progressBar {
    position: fixed;
    top: 0;
    right: 0;
    width: 6px;
    height: 0%;
    background: var(--accent);
}
</style>
</head>

<body>

<div id="progressBar"></div>

<header>
    <h3>📚 Viva Experiences</h3>
    <div class="toggle" onclick="toggleTheme()" id="icon">🌙</div>
</header>

<div class="container" id="content"></div>

<script type="module">
import { vivaData } from './v.data.js';

const container = document.getElementById("content");

vivaData.forEach(item => {

    let raw = item.questions;

    // Split entries manually
    let entries = raw.split("},").map(e => e + "}");

    entries.forEach(entry => {
        try {
            let idMatch = entry.match(/"id":\s*(\d+)/);
            let textMatch = entry.match(/"text":\s*"([^"]+)/);
            let lengthMatch = entry.match(/"length":\s*(\d+)/);

            if (!idMatch || !textMatch || !lengthMatch) return;

            let id = idMatch[1];
            let text = textMatch[1];
            let length = parseInt(lengthMatch[1]);

            if (length > 350) {
                let div = document.createElement("div");
                div.className = "card";

                div.innerHTML = `
                    <div class="id">ID: ${id}</div>
                    <div>${text}</div>
                `;

                container.appendChild(div);
            }

        } catch (err) {
            console.log("skip error", err);
        }
    });
});
</script>

<script>
function toggleTheme() {
    document.body.classList.toggle("dark");
    document.getElementById("icon").textContent =
        document.body.classList.contains("dark") ? "☀️" : "🌙";
}

// Scroll progress
window.onscroll = () => {
    let scroll = document.documentElement.scrollTop;
    let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    document.getElementById("progressBar").style.height = (scroll / height) * 100 + "%";
};
</script>

</body>
</html>
