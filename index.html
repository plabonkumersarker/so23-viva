<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SO23 Viva Experiences</title>

<style>
:root {
    --bg: #f4f6fb;
    --text: #1a1a1a;
    --card: #ffffff;
    --accent: #3b82f6;
    --muted: #6b7280;
}

body.dark {
    --bg: #0f172a;
    --text: #e5e7eb;
    --card: #1e293b;
    --accent: #60a5fa;
    --muted: #9ca3af;
}

body {
    margin: 0;
    font-family: "Inter", sans-serif;
    background: var(--bg);
    color: var(--text);
}

/* HEADER */
header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--card);
    padding: 12px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-bottom: 1px solid rgba(0,0,0,0.05);
}

/* TOP ROW */
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

h1 {
    font-size: 18px;
    margin: 0;
}

.toggle {
    cursor: pointer;
    font-size: 20px;
}

/* SEARCH */
.search-box {
    width: 100%;
}

.search-box input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: none;
    outline: none;
    background: var(--bg);
    font-size: 14.5px;
}

/* CONTENT */
.container {
    max-width: 850px;
    margin: 25px auto;
    padding: 0 16px;
}

.card {
    background: var(--card);
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.id {
    color: var(--accent);
    font-size: 12px;
    margin-bottom: 8px;
    font-weight: bold;
}

.text {
    font-size: 16px;
    line-height: 1.7;
}

/* RIGHT PROGRESS */
#progressBar {
    position: fixed;
    top: 0;
    right: 0;
    width: 5px;
    height: 0%;
    background: var(--accent);
}

/* LEFT SCROLL SLIDER */
#scrollSlider {
    position: fixed;
    left: 5px;
    top: 50%;
    transform: translateY(-50%) rotate(-90deg);
    width: 200px;
    z-index: 200;
}

#scrollSlider input {
    width: 100%;
}

/* MOBILE */
@media(max-width:600px){
    #scrollSlider {
        display: none;
    }
}
</style>
</head>

<body>

<div id="progressBar"></div>

<!-- LEFT SCROLL -->
<div id="scrollSlider">
    <input type="range" min="0" max="100" value="0" id="slider">
</div>

<header>
    <div class="top-bar">
        <h1>📚 SO-23 Viva Experiences</h1>
        <div class="toggle" onclick="toggleTheme()" id="icon">🌙</div>
    </div>

    <div class="search-box">
        <input type="text" id="search" placeholder="🔍 Search viva questions...">
    </div>
</header>

<div class="container" id="content"></div>

<script type="module">
import { vivaData } from './v.data.js';

const container = document.getElementById("content");
let allCards = [];

function loadData() {
    vivaData.forEach(item => {
        let raw = item.questions;
        let entries = raw.split("},").map(e => e + "}");

        entries.forEach(entry => {
            try {
                let idMatch = entry.match(/"id":\s*(\d+)/);
                let textMatch = entry.match(/"text":\s*"([^"]+)/);
                let lengthMatch = entry.match(/"length":\s*(\d+)/);

                if (!idMatch || !textMatch || !lengthMatch) return;

                let id = idMatch[1];
                let text = textMatch[1];
                let length = parseInt(lengthMatch[1]);

                if (length > 350) {
                    let div = document.createElement("div");
                    div.className = "card";
                    div.dataset.text = text.toLowerCase();

                    div.innerHTML = `
                        <div class="id">ID • ${id}</div>
                        <div class="text">${text}</div>
                    `;

                    container.appendChild(div);
                    allCards.push(div);
                }

            } catch(e){}
        });
    });
}

loadData();

/* SEARCH */
document.getElementById("search").addEventListener("input", function(){
    let value = this.value.toLowerCase();

    allCards.forEach(card => {
        if (card.dataset.text.includes(value)) {
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    });
});
</script>

<script>
function toggleTheme() {
    document.body.classList.toggle("dark");
    document.getElementById("icon").textContent =
        document.body.classList.contains("dark") ? "☀️" : "🌙";
}

/* RIGHT PROGRESS */
window.onscroll = () => {
    let scroll = document.documentElement.scrollTop;
    let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    let percent = (scroll / height) * 100;

    document.getElementById("progressBar").style.height = percent + "%";
    document.getElementById("slider").value = percent;
};

/* LEFT SLIDER CONTROL */
document.getElementById("slider").addEventListener("input", function(){
    let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    document.documentElement.scrollTop = (this.value / 100) * height;
});
</script>

</body>
</html>
