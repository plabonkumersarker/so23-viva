<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SO23 Viva Experiences</title>

<style>
:root {
    --bg: #f4f6fb;
    --text: #1a1a1a;
    --card: #ffffff;
    --accent: #3b82f6;
}

body.dark {
    --bg: #0f172a;
    --text: #e5e7eb;
    --card: #1e293b;
    --accent: #60a5fa;
}

body {
    margin: 0;
    font-family: "Inter", sans-serif;
    background: var(--bg);
    color: var(--text);
}

/* HEADER */
header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--card);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-bottom: 1px solid rgba(0,0,0,0.05);
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

h1 {
    font-size: 16px;
    margin: 0;
}

.toggle {
    cursor: pointer;
    font-size: 20px;
}

/* SEARCH */
.search-box input {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    outline: none;
    background: var(--bg);
    font-size: 14px;
}

/* CONTENT */
.container {
    max-width: 850px;
    margin: 20px auto;
    padding: 0 12px;
}

.card {
    background: var(--card);
    padding: 18px;
    margin-bottom: 14px;
    border-radius: 12px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.05);
}

.id {
    color: var(--accent);
    font-size: 12px;
    margin-bottom: 6px;
    font-weight: bold;
}

.text {
    font-size: 16px;
    line-height: 1.7;
}

/* PROGRESS BAR */
#progressBar {
    position: fixed;
    top: 0;
    right: 0;
    width: 3px;
    height: 0%;
    background: var(--accent);
}

/* PDF SCROLL (Mobile Ready) */
#pdfScroll {
    position: fixed;
    right: 4px;
    top: 90px;
    width: 20px;
    height: calc(100vh - 110px);
    background: rgba(0,0,0,0.05);
    border-radius: 10px;
    z-index: 200;
    touch-action: none;
}

body.dark #pdfScroll {
    background: rgba(255,255,255,0.08);
}

#thumb {
    width: 100%;
    background: var(--accent);
    border-radius: 10px;
    position: absolute;
    top: 0;
    height: 60px;
}

/* MOBILE */
@media(max-width:600px){
    .text { font-size: 15.5px; }
}
</style>
</head>

<body>

<div id="progressBar"></div>

<div id="pdfScroll">
    <div id="thumb"></div>
</div>

<header>
    <div class="top-bar">
        <h1>📚 SO23 Viva Experiences</h1>
        <div class="toggle" onclick="toggleTheme()" id="icon">🌙</div>
    </div>

    <div class="search-box">
        <input type="text" id="search" placeholder="🔍 Search viva...">
    </div>
</header>

<div class="container" id="content"></div>

<script type="module">
import { vivaData } from './v.data.js';

const container = document.getElementById("content");
let allCards = [];

vivaData.forEach(item => {
    let raw = item.questions;
    let entries = raw.split("},").map(e => e + "}");

    entries.forEach(entry => {
        try {
            let idMatch = entry.match(/"id":\s*(\d+)/);
            let textMatch = entry.match(/"text":\s*"([^"]+)/);
            let lengthMatch = entry.match(/"length":\s*(\d+)/);

            if (!idMatch || !textMatch || !lengthMatch) return;

            let id = idMatch[1];
            let text = textMatch[1];
            let length = parseInt(lengthMatch[1]);

            if (length > 350) {
                let div = document.createElement("div");
                div.className = "card";
                div.dataset.text = text.toLowerCase();

                div.innerHTML = `
                    <div class="id">ID • ${id}</div>
                    <div class="text">${text}</div>
                `;

                container.appendChild(div);
                allCards.push(div);
            }

        } catch(e){}
    });
});

/* SEARCH */
document.getElementById("search").addEventListener("input", function(){
    let val = this.value.toLowerCase();
    allCards.forEach(card => {
        card.style.display = card.dataset.text.includes(val) ? "block" : "none";
    });
});
</script>

<script>
function toggleTheme() {
    document.body.classList.toggle("dark");
    document.getElementById("icon").textContent =
        document.body.classList.contains("dark") ? "☀️" : "🌙";
}

/* SCROLL + PROGRESS */
const thumb = document.getElementById("thumb");
const track = document.getElementById("pdfScroll");

function updateThumb() {
    let scrollTop = document.documentElement.scrollTop;
    let docHeight = document.documentElement.scrollHeight - window.innerHeight;

    let trackHeight = track.clientHeight;

    // dynamic height
    let thumbHeight = Math.max((window.innerHeight / document.documentElement.scrollHeight) * trackHeight, 40);
    thumb.style.height = thumbHeight + "px";

    let maxMove = trackHeight - thumbHeight;
    let top = (scrollTop / docHeight) * maxMove;

    thumb.style.top = top + "px";

    // progress bar
    document.getElementById("progressBar").style.height = (scrollTop / docHeight) * 100 + "%";
}

window.addEventListener("scroll", updateThumb);

/* CLICK TRACK */
track.addEventListener("click", (e) => {
    if (e.target === thumb) return;

    let rect = track.getBoundingClientRect();
    let percent = (e.clientY - rect.top) / rect.height;

    let docHeight = document.documentElement.scrollHeight - window.innerHeight;
    document.documentElement.scrollTop = percent * docHeight;
});

/* DRAG SUPPORT (TOUCH + MOUSE) */
let dragging = false;

function startDrag(e) {
    dragging = true;
}

function stopDrag() {
    dragging = false;
}

function moveDrag(e) {
    if (!dragging) return;

    let clientY = e.touches ? e.touches[0].clientY : e.clientY;

    let rect = track.getBoundingClientRect();
    let percent = (clientY - rect.top) / rect.height;

    percent = Math.max(0, Math.min(1, percent));

    let docHeight = document.documentElement.scrollHeight - window.innerHeight;
    document.documentElement.scrollTop = percent * docHeight;
}

thumb.addEventListener("mousedown", startDrag);
document.addEventListener("mouseup", stopDrag);
document.addEventListener("mousemove", moveDrag);

thumb.addEventListener("touchstart", startDrag);
document.addEventListener("touchend", stopDrag);
document.addEventListener("touchmove", moveDrag);

updateThumb();
</script>

</body>
</html>
